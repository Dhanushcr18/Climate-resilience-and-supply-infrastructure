<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_2 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_2" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_2');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js interactive 3D Globe & Supply Route Network Scene for ResilienceOps
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 5, 26);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0x0f172a, 2.5);
scene.add(ambientLight);

const dirLight1 = new THREE.DirectionalLight(0x14f1d9, 2.0);
dirLight1.position.set(15, 20, 15);
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0x8b7cff, 1.8);
dirLight2.position.set(-15, -10, 10);
scene.add(dirLight2);

// Center 3D Globe / Tactical Geospatial Sphere
const globeGroup = new THREE.Group();
scene.add(globeGroup);

// Wireframe globe
const globeGeo = new THREE.SphereGeometry(9, 48, 48);
const globeMat = new THREE.MeshPhongMaterial({
  color: 0x05070d,
  emissive: 0x091428,
  wireframe: false,
  shininess: 30,
  transparent: true,
  opacity: 0.92
});
const globeMesh = new THREE.Mesh(globeGeo, globeMat);
globeGroup.add(globeMesh);

// Outer grid lattice
const wireGeo = new THREE.WireframeGeometry(new THREE.SphereGeometry(9.08, 28, 28));
const wireMat = new THREE.LineBasicMaterial({ color: 0x14f1d9, transparent: true, opacity: 0.18 });
const wireLines = new THREE.LineSegments(wireGeo, wireMat);
globeGroup.add(wireLines);

// Atmosphere halo glow ring
const ringGeo = new THREE.RingGeometry(9.4, 11.2, 64);
const ringMat = new THREE.MeshBasicMaterial({
  color: 0x14f1d9,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.12
});
const ringMesh = new THREE.Mesh(ringGeo, ringMat);
ringMesh.rotation.x = Math.PI / 2.3;
globeGroup.add(ringMesh);

// Key Telemetry City Nodes (India / Regional Hubs coordinate simulation)
const cityCoords = [
  { name: 'Kochi Hub', lat: 9.93, lon: 76.26, color: 0x22e3a0, size: 0.35, highRisk: false },
  { name: 'Bengaluru DC', lat: 12.97, lon: 77.59, color: 0x3ddcff, size: 0.4, highRisk: false },
  { name: 'Mangaluru Port', lat: 12.91, lon: 74.85, color: 0xff3b5c, size: 0.45, highRisk: true },
  { name: 'Chennai Terminal', lat: 13.08, lon: 80.27, color: 0x8b7cff, size: 0.35, highRisk: false },
  { name: 'Kozhikode Dep', lat: 11.25, lon: 75.78, color: 0xff8a3d, size: 0.35, highRisk: true },
  { name: 'Coimbatore Hub', lat: 11.01, lon: 76.95, color: 0x22e3a0, size: 0.3, highRisk: false },
  { name: 'Mumbai Primary', lat: 19.07, lon: 72.87, color: 0x3ddcff, size: 0.4, highRisk: false }
];

function latLonToVec3(lat, lon, radius) {
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lon + 180) * (Math.PI / 180);
  const x = -(radius * Math.sin(phi) * Math.cos(theta));
  const z = (radius * Math.sin(phi) * Math.sin(theta));
  const y = (radius * Math.cos(phi));
  return new THREE.Vector3(x, y, z);
}

const nodePoints = [];
const nodeMeshList = [];

cityCoords.forEach((city) => {
  const pos = latLonToVec3(city.lat, city.lon, 9.15);
  nodePoints.push(pos);

  const nodeGeo = new THREE.SphereGeometry(city.size, 16, 16);
  const nodeMat = new THREE.MeshBasicMaterial({ color: city.color });
  const nodeMesh = new THREE.Mesh(nodeGeo, nodeMat);
  nodeMesh.position.copy(pos);
  globeGroup.add(nodeMesh);
  nodeMeshList.push(nodeMesh);

  // Pulse ring around high risk nodes
  if (city.highRisk) {
    const pulseRingGeo = new THREE.RingGeometry(city.size * 1.3, city.size * 2.2, 24);
    const pulseRingMat = new THREE.MeshBasicMaterial({ color: city.color, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
    const pulseRing = new THREE.Mesh(pulseRingGeo, pulseRingMat);
    pulseRing.position.copy(pos);
    pulseRing.lookAt(pos.clone().multiplyScalar(2));
    globeGroup.add(pulseRing);
  }
});

// Arcs connecting city nodes (Routes)
const routes = [
  { start: 0, end: 1, color: 0x14f1d9, elevated: 1.8 }, // Kochi -> Blr
  { start: 1, end: 2, color: 0xff3b5c, elevated: 2.2 }, // Blr -> Mangaluru (Blocked Shiradi Ghat)
  { start: 1, end: 3, color: 0x8b7cff, elevated: 1.5 }, // Blr -> Chennai
  { start: 0, end: 4, color: 0xff8a3d, elevated: 1.6 }, // Kochi -> Kozhikode
  { start: 4, end: 5, color: 0x22e3a0, elevated: 1.4 }, // Kozhikode -> Coimbatore
  { start: 0, end: 5, color: 0x14f1d9, elevated: 1.5 }, // Kochi -> Coimbatore
  { start: 2, end: 6, color: 0x3ddcff, elevated: 2.5 }, // Mangaluru -> Mumbai
  // Dynamic Reroute Arc: bypassing Shiradi Ghat around coastal plain
  { start: 0, end: 2, color: 0x14f1d9, elevated: 2.8, isReroute: true }
];

const pulses = [];

routes.forEach((r) => {
  const p1 = nodePoints[r.start];
  const p2 = nodePoints[r.end];
  
  // Midpoint elevated outward
  const mid = p1.clone().add(p2).multiplyScalar(0.5);
  const distance = p1.distanceTo(p2);
  mid.normalize().multiplyScalar(9.15 + (r.elevated || distance * 0.35));

  const curve = new THREE.QuadraticBezierCurve3(p1, mid, p2);
  const curvePoints = curve.getPoints(40);
  const lineGeo = new THREE.BufferGeometry().setFromPoints(curvePoints);
  const lineMat = new THREE.LineBasicMaterial({
    color: r.color,
    transparent: true,
    opacity: r.isReroute ? 0.95 : 0.65,
    linewidth: 2
  });
  const arcLine = new THREE.Line(lineGeo, lineMat);
  globeGroup.add(arcLine);

  // Travelling photon beacon along each arc
  const pulseGeo = new THREE.SphereGeometry(0.18, 12, 12);
  const pulseMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const pulseMesh = new THREE.Mesh(pulseGeo, pulseMat);
  globeGroup.add(pulseMesh);
  pulses.push({ mesh: pulseMesh, curve: curve, t: Math.random(), speed: 0.006 + Math.random() * 0.005 });
});

// Particle field (Atmospheric monsoon precipitation & space dust)
const particleCount = 450;
const particleGeo = new THREE.BufferGeometry();
const particlePos = new Float32Array(particleCount * 3);
const particleColors = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount; i++) {
  const r = 10 + Math.random() * 8;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos((Math.random() * 2) - 1);
  
  particlePos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  particlePos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
  particlePos[i * 3 + 2] = r * Math.cos(phi);

  // Aurora teal and violet tint
  if (Math.random() > 0.5) {
    particleColors[i * 3] = 0.08;
    particleColors[i * 3 + 1] = 0.95;
    particleColors[i * 3 + 2] = 0.85;
  } else {
    particleColors[i * 3] = 0.54;
    particleColors[i * 3 + 1] = 0.48;
    particleColors[i * 3 + 2] = 1.0;
  }
}

particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
const particleMat = new THREE.PointsMaterial({
  size: 0.16,
  vertexColors: true,
  transparent: true,
  opacity: 0.75
});
const particles = new THREE.Points(particleGeo, particleMat);
globeGroup.add(particles);

// Default orientation targeting South Asia / India
globeGroup.rotation.y = -1.2;
globeGroup.rotation.x = 0.35;

// Interactive mouse parallax
let targetRotX = 0.35;
let targetRotY = -1.2;
let mouseX = 0;
let mouseY = 0;

window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth) * 2 - 1;
  mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
  targetRotY = -1.2 + mouseX * 0.4;
  targetRotX = 0.35 - mouseY * 0.3;
});

// Render Loop
let clock = 0;
function animate() {
  requestAnimationFrame(animate);
  clock += 0.01;

  // Gentle globe spin
  globeGroup.rotation.y += (targetRotY - globeGroup.rotation.y) * 0.05 + 0.001;
  globeGroup.rotation.x += (targetRotX - globeGroup.rotation.x) * 0.05;

  // Animate travelling route pulses
  pulses.forEach((p) => {
    p.t += p.speed;
    if (p.t > 1.0) p.t = 0;
    const pt = p.curve.getPoint(p.t);
    p.mesh.position.copy(pt);
  });

  // Slowly drift particles
  particles.rotation.y += 0.0008;

  renderer.render(scene, camera);
}
animate();

// Resize handler
window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_2 -->
</body>
</html>
